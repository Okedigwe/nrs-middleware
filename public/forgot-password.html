<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | MSL Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .forgot-card { width: 100%; max-width: 400px; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background: #fff; }
        .brand-logo { text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="forgot-card">
    <div class="brand-logo">
        <img src="assets/img/favicon.png" alt="MSL Logo" style="width: 60px;">
        <h4 class="mt-2">MSL Portal</h4>
    </div>
    
    <h5 class="text-center mb-3">Reset Password</h5>
    <p class="text-muted text-center small">Enter your email address and we'll send you a link to reset your password.</p>

    <form id="forgotForm">
        <div class="mb-3">
            <label for="resetEmail" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="resetEmail" placeholder="support@microwaresolutions.com" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
    </form>

    <div class="mt-4 text-center">
        <a href="login.html" class="text-decoration-none small">← Back to Login</a>
    </div>
</div>

<script src="assets/js/auth.js"></script>

</body>
</html>
