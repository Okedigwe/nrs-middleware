<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NRS Portal | All Invoices</title>
        <link rel="icon" type="image/png" href="assets/img/favicon.png">

<meta property="og:type" content="website">
<meta property="og:url" content="https://nrs-msl.render.com/"> <meta property="og:title" content="MSL E-Invoicing Portal | Microware Solutions Ltd">
<meta property="og:description" content="Secure e-Invoicing middleware integration for the Nigerian market.">
<meta property="og:image" content="https://nrs-msl.render.com/assets/img/og-thumbnail.png"> 

<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:title" content="MSL E-Invoicing Portal | Microware Solutions Ltd">
<meta property="twitter:description" content="Secure e-Invoicing middleware integration for the Nigerian market.">
<meta property="twitter:image" content="https://nrs-msl.render.com/assets/img/og-thumbnail.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="sidebar-container"></div>

    <div id="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>Invoice Management</h3>
            <div class="d-flex gap-2">
                <input type="text" id="searchInput" class="form-control" placeholder="Search by Inv # or TIN...">
                <button class="btn btn-outline-primary" onclick="refreshInvoiceList()">Refresh</button>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Invoice #</th>
                            <th>Customer TIN</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="invoiceListBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="detailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Invoice Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-8">
                            <h6>UBL XML Stamp</h6>
                            <pre id="xmlPreview" class="bg-light p-3 rounded" style="font-size: 11px; max-height: 300px; overflow-y: auto;"></pre>
                        </div>
                        <div class="col-md-4 text-center">
                            <h6>NRS QR Stamp</h6>
                            <img id="modalQr" src="" class="img-fluid border p-2 mb-3">
                            <button class="btn btn-success btn-sm w-100" onclick="window.print()">Print Receipt</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="assets/js/auth.js"></script>
    
    <script src="assets/js/invoices.js"></script>
</body>
</html>
