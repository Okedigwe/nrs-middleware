<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NRS Portal | Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="sidebar">
        <h4 class="text-center mb-4">NRS Portal</h4>
        <a href="index.html">Dashboard</a>
        <a href="invoices.html">Invoices</a>
        <a href="customers.html">Customers</a>
        <a href="upload.html">Manual Upload</a>
        <a href="settings.html" class="active">Settings</a>
        <hr>
        <a href="#" onclick="logout()">Sign Out</a>
    </div>

    <div id="main-content">
        <h3 class="mb-4">System Settings</h3>

        <div class="row">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">NRS API Credentials</h5>
                    </div>
                    <div class="card-body">
                        <form id="settingsForm">
                            <div class="mb-3">
                                <label class="form-label">Base API URL</label>
                                <input type="text" id="apiUrl" class="form-control" placeholder="https://test-api.nrs.gov.ng/v1">
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Client ID</label>
                                    <input type="text" id="clientId" class="form-control">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Client Secret</label>
                                    <input type="password" id="clientSecret" class="form-control">
                                </div>
                            </div>
                            <div class="form-check form-switch mb-4">
                                <input class="form-check-input" type="checkbox" id="mockMode">
                                <label class="form-check-label">Enable Sandbox/Mock Mode</label>
                            </div>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm border-0 bg-light">
                    <div class="card-body">
                        <h6>System Info</h6>
                        <hr>
                        <p><small>Middleware Version: <strong>1.0.0-beta</strong></small></p>
                        <p><small>Environment: <span class="badge bg-info">Development</span></small></p>
                        <p><small>Last Sync: <span id="lastSync">Never</span></small></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/settings.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
