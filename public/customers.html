<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NRS Portal | Customers</title>
        <link rel="icon" type="image/png" href="assets/img/favicon.png">

<meta property="og:type" content="website">
<meta property="og:url" content="https://nrs-msl.render.com/"> <meta property="og:title" content="NRS Middleware Portal | Microwave Solutions">
<meta property="og:description" content="Secure e-Invoicing middleware integration for the Nigerian market.">
<meta property="og:image" content="https://nrs-msl.render.com/assets/img/favicon.png"> 

<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:title" content="NRS Middleware Portal | Microwave Solutions">
<meta property="twitter:description" content="Secure e-Invoicing middleware integration for the Nigerian market.">
<meta property="twitter:image" content="https://nrs-msl.render.com/assets/img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div id="sidebar-container"></div>

    <div id="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>Customer Directory</h3>
            <div class="d-flex gap-2">
                <input type="text" id="searchInput" class="form-control" placeholder="Search name or TIN...">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#customerModal" style="white-space: nowrap;">+ Add Customer</button>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Customer Name</th>
                            <th>TIN</th>
                            <th>Email</th>
                            <th>Invoices Sent</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="customerListBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="customerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">New Customer</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="addCustomerForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Company/Customer Name</label>
                            <input type="text" id="custName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tax Identification Number (TIN)</label>
                            <input type="text" id="custTin" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" id="custEmail" class="form-control" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Customer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="assets/js/auth.js"></script>
    
    <script src="assets/js/customers.js"></script>
</body>
</html>
