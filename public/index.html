<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NRS E-Invoicing | Dashboard</title>
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nrs-msl.render.com/"> <meta property="og:title" content="NRS Middleware Portal | Microwave Solutions">
<meta property="og:description" content="Secure e-Invoicing middleware integration for the Nigerian market.">
<meta property="og:image" content="https://nrs-msl.render.com/assets/img/favicon.png"> 

<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:title" content="NRS Middleware Portal | Microwave Solutions">
<meta property="twitter:description" content="Secure e-Invoicing middleware integration for the Nigerian market.">
<meta property="twitter:image" content="https://nrs-msl.render.com/assets/img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div id="sidebar-container"></div>

    <div id="main-content">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h3>Welcome back, Kingsley</h3>
            <span class="badge bg-primary">Connected to NRS API</span>
        </header>

        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card p-3 shadow-sm border-0">
                    <small class="text-muted">Total Documents</small>
                    <h2 id="stat-total">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 shadow-sm border-0 border-start border-warning border-4">
                    <small class="text-muted">Pending</small>
                    <h2 id="stat-pending" class="text-warning">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 shadow-sm border-0 border-start border-success border-4">
                    <small class="text-muted">Completed</small>
                    <h2 id="stat-completed" class="text-success">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 shadow-sm border-0 border-start border-danger border-4">
                    <small class="text-muted">Rejected</small>
                    <h2 id="stat-rejected" class="text-danger">0</h2>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">
                <h5>Recent Invoices</h5>
                <table class="table table-hover mt-3">
                    <thead class="table-light">
                        <tr>
                            <th>Inv #</th>
                            <th>Customer</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>NRS Stamp</th>
                        </tr>
                    </thead>
                    <tbody id="invoiceTable">
                        </tbody>
                </table>
            </div>
        </div>

        <footer>
            &copy; 2026 NRS E-Invoicing Portal | Microware Solutions Ltd
        </footer>
    </div>

    <script src="assets/js/auth.js"></script> <script src="assets/js/dashboard.js"></script>
</body>
</html>
