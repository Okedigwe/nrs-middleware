<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NRS E-Invoicing | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div id="sidebar">
        <h4 class="text-center mb-4">NRS Portal</h4>
        <a href="index.html" class="active">Dashboard</a>
        <a href="invoices.html">Invoices</a>
        <a href="customers.html">Customers</a>
        <a href="upload.html">Manual Upload</a>
        <a href="settings.html">API Settings</a>
        <hr>
        <a href="login.html">Sign Out</a>
    </div>

    <div id="main-content">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h3>Welcome back, Kingsley</h3>
            <span class="badge bg-primary">Connected to NRS API</span>
        </header>

        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card p-3 shadow-sm border-0">
                    <small class="text-muted">Total Documents</small>
                    <h2 id="stat-total">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 shadow-sm border-0 border-start border-warning border-4">
                    <small class="text-muted">Pending</small>
                    <h2 id="stat-pending" class="text-warning">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 shadow-sm border-0 border-start border-success border-4">
                    <small class="text-muted">Completed</small>
                    <h2 id="stat-completed" class="text-success">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 shadow-sm border-0 border-start border-danger border-4">
                    <small class="text-muted">Rejected</small>
                    <h2 id="stat-rejected" class="text-danger">0</h2>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">
                <h5>Recent Invoices</h5>
                <table class="table table-hover mt-3">
                    <thead class="table-light">
                        <tr>
                            <th>Inv #</th>
                            <th>Customer</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>NRS Stamp</th>
                        </tr>
                    </thead>
                    <tbody id="invoiceTable">
                        </tbody>
                </table>
            </div>
        </div>

        <footer>
            &copy; 2026 NRS Middleware Portal | Kingsley Okedigwe
        </footer>
    </div>

    <script src="assets/js/dashboard.js"></script>
</body>
</html>
