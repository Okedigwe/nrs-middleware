<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSL E-Invoicing Portal | Login</title>
    <link rel="icon" type="image/png" href="assets/img/favicon.png">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nrs-msl.render.com/"> 
    <meta property="og:title" content="MSL E-Invoicing Portal | Microwave Solutions">
    <meta property="og:description" content="Secure e-Invoicing middleware integration for the Nigerian market.">
    <meta property="og:image" content="https://nrs-msl.render.com/assets/img/og-thumbnail.png">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="MSL E-Invoicing Portal | Microwave Solutions">
    <meta property="twitter:description" content="Secure e-Invoicing middleware integration for the Nigerian market.">
    <meta property="twitter:image" content="https://nrs-msl.render.com/assets/img/og-thumbnail.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">

    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <style>
        body {
            background: linear-gradient(135deg, #2c3e50 0%, #000000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 12px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    
    <div class="login-card">
        <div class="text-center mb-4">
            <h3 class="fw-bold">MSL E-Invoicing Platform</h3>
            <p class="text-muted">Sign in to manage e-invoices</p>
        </div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="name@company.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="g-recaptcha mb-3" data-sitekey="6Ld-hrUsAAAAABp77njidOD2bWrIXasrEcmnVqhq"></div>

            <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
        </form>
        
        <div class="mt-3 text-center">
            <small><a href="forgot-password.html" class="text-decoration-none">Forgot password?</a></small>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
</body>
</html>
